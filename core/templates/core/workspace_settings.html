{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ object.name }} settings | Client tasks</title><link rel="stylesheet" href="{% static 'core/landing.css' %}"></head>
<body class="auth-page action-page"><div class="page-shell"><header class="topbar"><a class="brand" href="{% url 'workspace-home' object.pk %}"><span class="brand-mark">CT</span><span>Client tasks</span></a><span class="workspace-current">{{ object.name }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button" type="submit">Sign out</button></form></header><main class="login-panel task-form-panel"><a class="back-link" href="{% url 'workspace-home' object.pk %}">← Back to {{ object.name }}</a><p class="eyebrow">{{ object.name }} / Settings</p><h1>Settings for {{ object.name }}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary-button primary-button--full" type="submit">Save settings</button></form></main></div></body></html>
