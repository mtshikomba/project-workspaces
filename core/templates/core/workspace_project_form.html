{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New project | {{ workspace.name }}</title><link rel="stylesheet" href="{% static 'core/landing.css' %}"></head>
<body class="auth-page action-page"><div class="page-shell"><header class="topbar"><a class="brand" href="{% url 'workspace-home' workspace.pk %}"><span class="brand-mark">CT</span><span>Client tasks</span></a><span class="workspace-current">{{ workspace.name }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button" type="submit">Sign out</button></form></header><main class="login-panel task-form-panel"><a class="back-link" href="{% url 'workspace-projects' workspace.pk %}">← Back to {{ workspace.name }}</a><p class="eyebrow">Company workspace</p><h1>Create a project in {{ workspace.name }}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary-button primary-button--full" type="submit">Create project</button></form></main></div></body></html>
