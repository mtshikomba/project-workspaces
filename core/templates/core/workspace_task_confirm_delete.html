{% load static %}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delete {{ task.title }} | {{ workspace.name }}</title><link rel="stylesheet" href="{% static 'core/landing.css' %}"></head>
<body class="auth-page action-page"><div class="page-shell"><header class="topbar"><a class="brand" href="{% url 'workspace-home' workspace.pk %}"><span class="brand-mark">CT</span><span>Client tasks</span></a><span class="workspace-current">{{ workspace.name }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button" type="submit">Sign out</button></form></header><main class="login-panel"><a class="back-link" href="{% url 'workspace-task-detail' workspace.pk task.pk %}">← Keep task</a><p class="eyebrow">{{ workspace.name }} / Tasks</p><h1>Delete “{{ task.title }}”?</h1><p class="form-note">This removes the task from the selected company workspace.</p><form method="post">{% csrf_token %}<button class="danger-button primary-button--full" type="submit">Delete task</button></form></main></div></body></html>
