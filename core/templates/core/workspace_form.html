{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New company workspace</title>
    <link rel="stylesheet" href="{% static 'core/landing.css' %}">
</head>
<body class="auth-page action-page">
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'client-landing' %}">
                <span class="brand-mark">CT</span>
                <span>Client tasks</span>
            </a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="text-button" type="submit">Sign out</button>
            </form>
        </header>
        <main class="login-panel task-form-panel">
        <a class="back-link" href="{% url 'client-landing' %}">← Back to workspace</a>
        <p class="eyebrow">Company collaboration</p>
        <h1>Create a company workspace</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary-button primary-button--full" type="submit">Create workspace</button>
        </form>
        </main>
    </div>
</body>
</html>
